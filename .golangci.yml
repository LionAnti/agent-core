linters:
  enable:
    - gofmt
    - govet
    - errcheck
    - staticcheck
    - revive
    - misspell
    - unconvert

linters-settings:
  revive:
    rules:
      - name: exported
        severity: warning
        disabled: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
